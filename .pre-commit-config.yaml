repos:
  pre-commit:
    hooks:
      - id: gofmt
        name: gofmt
        language: system
        entry: gofmt -w
        types: [go]
      - id: go-vet
        name: go vet
        language: system
        entry: go vet ./...
        types: [go]
        pass_filenames: false
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
