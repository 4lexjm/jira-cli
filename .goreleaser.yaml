version: 2
project_name: jira

builds:
  - id: jira
    main: ./cmd/jira/main.go
    binary: jira
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/atlassian/jira-cli/internal/build.Version={{.Version}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: jira-archive
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    builds:
      - jira
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - skills/**/*
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next+{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: '🚀 Features'
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: '🐛 Bug Fixes'
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: '📦 Dependencies'
      regexp: '^deps(\(.+\))?:'
      order: 2
    - title: '🔧 Other Changes'
      order: 999

release:
  github:
    owner: 4lexjm
    name: jira-cli
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## jira {{ .Tag }} ({{ .Date }})

    Thanks for trying the Jira CLI!
  footer: |
    ---
